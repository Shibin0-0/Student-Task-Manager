{% extends "base.html" %}

{% block title %}Edit Task — Student Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10 col-lg-7">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item">
                    <a href="{{ url_for('tasks.dashboard') }}" class="text-primary text-decoration-none">Dashboard</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{{ url_for('tasks.task_list') }}" class="text-primary text-decoration-none">My Tasks</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Edit Task</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm">
            <div class="card-header py-3 px-4" style="background: #f8fafc; border-bottom: 1.5px solid #e2e8f0;">
                <h1 class="h5 fw-bold mb-0" style="color: #1e3a5f;">
                    <i class="bi bi-pencil me-2 text-primary"></i>Edit Task
                </h1>
            </div>
            <div class="card-body p-4">

                <form
                    method="POST"
                    action="{{ url_for('tasks.edit_task_view', task_id=task.id) }}"
                    novalidate
                    id="edit-task-form"
                >
                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">
                            Title <span class="text-danger">*</span>
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            value="{{ task.title }}"
                            maxlength="200"
                            required
                            autofocus
                        >
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">
                            Description
                        </label>
                        <textarea
                            class="form-control"
                            id="description"
                            name="description"
                            rows="4"
                            placeholder="Optional details…"
                        >{{ task.description if task.description else '' }}</textarea>
                    </div>

                    <!-- Due Date -->
                    <div class="mb-3">
                        <label for="due_date" class="form-label fw-semibold">
                            Due Date
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-calendar3"></i>
                            </span>
                            <input
                                type="date"
                                class="form-control"
                                id="due_date"
                                name="due_date"
                                value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}"
                            >
                        </div>
                        <div class="form-text">Leave blank to remove the due date.</div>
                    </div>

                    <!-- Status -->
                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="pending"
                                {{ 'selected' if task.status == 'pending' else '' }}>
                                ⏳ Pending
                            </option>
                            <option value="completed"
                                {{ 'selected' if task.status == 'completed' else '' }}>
                                ✅ Completed
                            </option>
                        </select>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-2"></i>Save Changes
                        </button>
                        <a href="{{ url_for('tasks.task_list') }}" class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>

        <!-- Task metadata footer -->
        <p class="text-muted small mt-3 ps-1">
            <i class="bi bi-clock-history me-1"></i>
            Created on {{ task.created_at.strftime('%d %b %Y at %H:%M') }}
        </p>

    </div>
</div>
{% endblock %}
