{% extends "base.html" %}

{% block title %}New Task — Student Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10 col-lg-7">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item">
                    <a href="{{ url_for('tasks.dashboard') }}" class="text-primary text-decoration-none">Dashboard</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{{ url_for('tasks.task_list') }}" class="text-primary text-decoration-none">My Tasks</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">New Task</li>
            </ol>
        </nav>

        <div class="card border-0 shadow-sm">
            <div class="card-header py-3 px-4" style="background: #f8fafc; border-bottom: 1.5px solid #e2e8f0;">
                <h1 class="h5 fw-bold mb-0" style="color: #1e3a5f;">
                    <i class="bi bi-plus-circle me-2 text-primary"></i>Create a New Task
                </h1>
            </div>
            <div class="card-body p-4">

                <form
                    method="POST"
                    action="{{ url_for('tasks.create_task_view') }}"
                    novalidate
                    id="create-task-form"
                >
                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">
                            Title <span class="text-danger">*</span>
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            value="{{ title | default('') }}"
                            placeholder="e.g. Complete assignment 3"
                            maxlength="200"
                            required
                            autofocus
                        >
                        <div class="form-text">Required. 200 characters max.</div>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">
                            Description
                        </label>
                        <textarea
                            class="form-control"
                            id="description"
                            name="description"
                            rows="4"
                            placeholder="Optional details about this task…"
                        >{{ description | default('') }}</textarea>
                    </div>

                    <!-- Due Date -->
                    <div class="mb-4">
                        <label for="due_date" class="form-label fw-semibold">
                            Due Date
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-calendar3"></i>
                            </span>
                            <input
                                type="date"
                                class="form-control"
                                id="due_date"
                                name="due_date"
                                value="{{ due_date | default('') }}"
                            >
                        </div>
                        <div class="form-text">Optional. Leave blank if there's no deadline.</div>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary px-4" id="create-btn">
                            <i class="bi bi-check-lg me-2"></i>Create Task
                        </button>
                        <a href="{{ url_for('tasks.task_list') }}" class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
